# Production: scripts/deploy.sh <version> runs this on the server (see docs/deployment.md).
# Local try-out: `docker compose up --build` and open http://localhost:3000.
services:
  app:
    image: ghcr.io/thurahtetaung/virtual-tavern:${IMAGE_TAG:-latest}
    build: .
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    volumes:
      - tavern-data:/data
    ports:
      # Loopback only: the public reaches the app through a Cloudflare tunnel on the host.
      - '127.0.0.1:${APP_PORT:-3000}:3000'

volumes:
  tavern-data:
