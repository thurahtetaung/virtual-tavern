name: CI

# CI runs once per change, on its PR. A merge to main runs no CI: the release workflow publishes
# what the PR already checked.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The production image is linux/arm64 only (the server is aarch64), so the PR builds that same
  # image natively on an arm runner and shares its build cache with the release.
  docker:
    name: Docker build
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/arm64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # The static checks run as parallel jobs: each is about a minute on its own.
  lint:
    name: Format and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm format:check
      - run: pnpm lint
      # Every e2e spec needs a measured time, or the shards are balanced on a guess.
      - run: node e2e/shards.ts --check

  typecheck:
    name: Typecheck and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm typecheck
      - run: pnpm build

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm test

  # The browser suite, split across parallel jobs. Each shard builds and starts its own server with
  # its own in-memory database, so specs that share server state (the back-room project) stay safe.
  # e2e/shards.ts balances the shards by the measured run times in e2e/timings.json. The build
  # takes seconds, so each shard builds its own rather than waiting on a shared artifact.
  e2e:
    name: e2e (shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm build
      # Headless runs only need the headless shell, not the full browser.
      - run: pnpm exec playwright install --with-deps --only-shell chromium
      - run: |
          # A separate assignment, so a failing split fails the step instead of running everything.
          list=$(node e2e/shards.ts "$SHARD" 4)
          read -ra specs <<< "$list"
          pnpm exec playwright test "${specs[@]}"
        env:
          SHARD: ${{ matrix.shard }}
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-${{ matrix.shard }}
          path: |
            playwright-report
            test-results
          retention-days: 7
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-timings-${{ matrix.shard }}
          path: e2e-timings.json
          retention-days: 30

  # The one check branch protection requires: green only when every static check and every e2e
  # shard passed.
  check:
    name: Lint, typecheck, test, build, e2e
    needs: [lint, typecheck, unit, e2e]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "lint: ${LINT}, typecheck: ${TYPECHECK}, unit: ${UNIT}, e2e: ${E2E}"
          for result in "${LINT}" "${TYPECHECK}" "${UNIT}" "${E2E}"; do test "${result}" = success; done
        env:
          LINT: ${{ needs.lint.result }}
          TYPECHECK: ${{ needs.typecheck.result }}
          UNIT: ${{ needs.unit.result }}
          E2E: ${{ needs.e2e.result }}
