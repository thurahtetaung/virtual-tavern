name: Deploy

# Called by the release workflow; run it by hand to redeploy or roll back to any released version.
on:
  workflow_call:
    inputs:
      version:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      version:
        description: Version to deploy, without the "v" (e.g. 0.2.1)
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.PUBLIC_URL }}
    env:
      VERSION: ${{ inputs.version }}
      CLOUDFLARED_VERSION: 2026.9.3
    steps:
      - name: Validate version
        run: '[[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Bad version: $VERSION"; exit 1; }'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: v${{ inputs.version }}
      - name: Install cloudflared
        run: |
          curl -fsSL -o /tmp/cloudflared.deb \
            "https://github.com/cloudflare/cloudflared/releases/download/${CLOUDFLARED_VERSION}/cloudflared-linux-amd64.deb"
          sudo dpkg -i /tmp/cloudflared.deb
      - name: Configure SSH through Cloudflare Access
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<CONFIG
          Host target
            HostName $DEPLOY_HOST
            User $DEPLOY_USER
            IdentityFile ~/.ssh/deploy
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            HostKeyAlias $DEPLOY_HOST
            ProxyCommand cloudflared access ssh --hostname %h --service-token-id \${CF_ACCESS_CLIENT_ID} --service-token-secret \${CF_ACCESS_CLIENT_SECRET}
          CONFIG
      - name: Upload deploy files and deploy
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          DEPLOY_DIR: ${{ vars.DEPLOY_DIR || 'virtual-tavern' }}
        # Variables expand on the runner on purpose (SC2029).
        run: |
          # shellcheck disable=SC2029
          ssh target "mkdir -p '$DEPLOY_DIR'"
          scp docker-compose.yml scripts/deploy.sh "target:$DEPLOY_DIR/"
          # shellcheck disable=SC2029
          ssh target "cd '$DEPLOY_DIR' && ./deploy.sh '$VERSION'"
      - name: Check the public site
        if: vars.PUBLIC_URL != ''
        env:
          PUBLIC_URL: ${{ vars.PUBLIC_URL }}
        run: |
          for _ in $(seq 12); do
            body=$(curl -fsS "$PUBLIC_URL/healthz" || true)
            echo "$body"
            [[ "$body" == *"\"version\":\"$VERSION\""* ]] && exit 0
            sleep 5
          done
          echo "Public site is not serving $VERSION" >&2
          exit 1
