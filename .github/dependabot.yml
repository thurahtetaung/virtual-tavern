version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Node types track the runtime (Volta pin, currently Node 24 LTS); bump with the runtime.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # three.js is pinned for the 3D bomb and moves only on purpose.
      - dependency-name: 'three'
      - dependency-name: '@types/three'
    commit-message:
      prefix: chore(deps)
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      codeql-action:
        patterns: ['github/codeql-action*']
    commit-message:
      prefix: ci(deps)
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      # The Node major moves only with an LTS switch (see the Volta pin).
      - dependency-name: node
        update-types: ['version-update:semver-major']
    commit-message:
      prefix: chore(deps)
